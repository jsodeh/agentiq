name: "Release agēntīq Multi-OS Desktop Apps"

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: "-b dmg"
          - platform: "ubuntu-22.04"
            args: "-b deb,appimage"
          - platform: "windows-latest"
            args: "-b nsis"

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev build-essential curl wget file

      - name: Install Frontend Dependencies
        run: npm install

      - name: Build Frontend Bundle
        run: npm run build

      - name: Build and Publish Tauri Desktop Apps
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          tagName: v__VERSION__
          releaseName: 'agēntīq v__VERSION__'
          releaseBody: 'See assets below for standalone executables (.dmg, .exe, .AppImage, .deb)'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
